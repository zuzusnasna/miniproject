<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 - Game Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/gamehub.css">
    <style>
        .mypage-container { max-width: 900px; margin: 40px auto; background:#fff; padding:30px; border-radius:12px; border:1px solid var(--border-color,#e0e0e0); box-shadow:0 4px 15px rgba(0,0,0,.05); }
        .mypage-header { text-align:center; margin-bottom:30px; padding-bottom:20px; border-bottom:1px solid var(--border-color,#e0e0e0); }
        .stat-box { display:flex; justify-content:space-around; background:linear-gradient(135deg,#fdfbfe,#f5f0fc); border:1px solid #ebdffc; padding:15px; border-radius:8px; margin-bottom:25px; text-align:center; }
        .stat-box div strong { display:block; font-size:20px; color:var(--primary-color,#5a20b7); margin-top:5px; }
        .level-section { margin:0 0 25px; padding:16px; border:1px solid var(--border-color,#e0e0e0); border-radius:10px; background:#fff; }
        .level-progress-info,.level-progress-text { display:flex; justify-content:space-between; align-items:center; font-size:13px; }
        .level-progress-info { margin-bottom:8px; font-weight:700; }
        .level-progress { width:100%; height:10px; overflow:hidden; border-radius:999px; background:#e9ecef; }
        .level-progress-fill { height:100%; border-radius:999px; background:var(--primary-color,#5a20b7); transition:width .3s ease; }
        .level-progress-text { margin-top:7px; color:#666; }
        .level-progress-remaining { margin-top:8px; text-align:center; font-size:13px; color:#777; }
        .form-group { margin-bottom:20px; }
        .form-group label { font-weight:bold; margin-bottom:8px; display:block; color:#444; }
        .management-section { margin-top:30px; padding-top:25px; border-top:1px solid #eee; }
        .management-section h4 { margin-bottom:8px; }
    </style>
</head>
<body>
<main id="main-content">
    <div class="mypage-container">
        <div class="mypage-header">
            <h2 class="fw-bold">👤 마이페이지</h2>
            <p class="text-muted">내 정보를 확인하고 수정할 수 있습니다.</p>
        </div>

        <div class="stat-box">
            <div>레벨<strong id="myLevel">-</strong></div>
            <div>받은 좋아요<strong id="myLikes" style="color:#1976d2;">-</strong></div>
            <div>받은 나빠요<strong id="myDislikes" style="color:#d32f2f;">-</strong></div>
        </div>

        <div class="level-section">
            <div class="level-progress-info">
                <span>Lv.<span id="levelCurrent">1</span></span>
                <span id="levelNext">Lv.2</span>
            </div>
            <div class="level-progress"><div id="levelProgressFill" class="level-progress-fill" style="width:0%;"></div></div>
            <div class="level-progress-text">
                <span id="levelLikeText">0 / 10 좋아요</span>
                <span id="levelProgressPercent">0%</span>
            </div>
            <div id="levelRemaining" class="level-progress-remaining">다음 레벨까지 <strong>10</strong>개</div>
        </div>

        <form action="member-update" method="post" id="updateForm">
            <div class="form-group">
                <label>아이디 (수정 불가)</label>
                <input type="text" id="username" class="form-control" readonly style="background-color:#e9ecef;">
            </div>
            <div class="form-group">
                <label for="name">이름</label>
                <input type="text" id="name" name="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" name="nickname" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password">새 비밀번호 (변경할 때만 입력)</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="변경하지 않으면 비워두세요">
            </div>
            <div class="form-group">
                <label for="phone">전화번호</label>
                <input type="text" id="phone" name="phone" class="form-control" placeholder="010-0000-0000" required>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 mt-3" style="padding:12px;font-size:16px;">정보 수정하기</button>
        </form>

        <div class="mt-4 pt-3 border-top text-end">
            <a href="mypage-withdraw.html" class="btn btn-outline-danger btn-sm">회원 탈퇴</a>
        </div>

        <!-- 카테고리 관리자 전용 -->
        <div id="categoryManagerSection" class="management-section" style="display:none;">
            <h4 class="fw-bold text-dark">🎮 내 게임 게시판 생성</h4>
            <p class="text-muted small mb-3">
                현재 관리 중인 게임(<span id="managedGameLabel" class="fw-bold text-primary">-</span>) 하위에 새 게시판 생성을 요청합니다.<br>
                생성된 게시판은 시스템 관리자의 승인 후 공개됩니다.
            </p>
            <div class="input-group mb-2">
                <input type="text" id="newCategoryName" class="form-control" placeholder="생성할 게시판/탭 이름 (예: 공략 팁, 질문게시판)" maxlength="50">
                <button type="button" class="btn btn-success fw-bold px-4" onclick="requestCreateCategory()">생성 요청</button>
            </div>
            <div id="createCategoryMsg" class="small mt-1"></div>
        </div>

        <!-- 시스템 관리자 전용 -->
        <div id="adminApprovalSection" class="management-section" style="display:none;">
            <h4 class="fw-bold text-dark mb-3">📋 게시판 생성 승인 대기 목록</h4>
            <div class="table-responsive">
                <table class="table table-bordered align-middle text-center">
                    <thead class="table-light">
                    <tr><th>게임명</th><th>게시판 이름</th><th>신청 일시</th><th>관리</th></tr>
                    </thead>
                    <tbody id="pendingTableBody">
                    <tr><td colspan="4" class="text-muted">불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="js/common.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('success') === 'true') {
        alert('회원 정보가 성공적으로 수정되었습니다!');
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    // 회원 정보
    fetch('member-info', { credentials:'include' })
        .then(response => {
            if (response.status === 401) { alert('로그인이 필요합니다.'); location.href='login.html'; throw new Error('Unauthorized'); }
            if (!response.ok) throw new Error('회원정보 조회 실패');
            return response.json();
        })
        .then(member => {
            const likeCount = Number(member.receivedLikeCount) || 0;
            const dislikeCount = Number(member.receivedDislikeCount) || 0;
            const actualLevel = Math.min(Math.floor(likeCount / 10) + 1, 10);
            const currentLikes = actualLevel >= 10 ? 10 : likeCount % 10;
            const progress = Math.max(0, Math.min(100, currentLikes * 10));
            const remaining = actualLevel >= 10 ? 0 : 10 - currentLikes;

            document.getElementById('myLevel').textContent = actualLevel;
            document.getElementById('myLikes').textContent = likeCount;
            document.getElementById('myDislikes').textContent = dislikeCount;
            document.getElementById('levelCurrent').textContent = actualLevel;
            document.getElementById('levelNext').textContent = actualLevel >= 10 ? 'MAX' : 'Lv.' + (actualLevel + 1);
            document.getElementById('levelProgressFill').style.width = progress + '%';
            document.getElementById('levelLikeText').textContent = currentLikes + ' / 10 좋아요';
            document.getElementById('levelProgressPercent').textContent = Math.round(progress) + '%';
            document.getElementById('levelRemaining').innerHTML = actualLevel >= 10 ? '🎉 최고 레벨입니다!' : '다음 레벨까지 <strong>' + remaining + '</strong>개';
            document.getElementById('username').value = member.username || '';
            document.getElementById('name').value = member.name || '';
            document.getElementById('nickname').value = member.nickname || '';
            document.getElementById('phone').value = member.phone || '';
        })
        .catch(error => console.error('회원정보 로드 실패:', error));

    // 시스템 관리자: 게시판 생성 승인/거절
    async function loadPendingCategories() {
        const section = document.getElementById('adminApprovalSection');
        const tbody = document.getElementById('pendingTableBody');
        try {
            const res = await fetch('admin/categories', { credentials:'include' });
            if (res.status === 401 || res.status === 403) return;
            if (!res.ok) throw new Error('승인 목록 조회 실패');

            const list = await res.json();
            section.style.display = 'block';
            tbody.innerHTML = '';

            if (!list.length) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-muted">승인 대기 중인 게시판이 없습니다.</td></tr>';
                return;
            }

            list.forEach(c => {
                const gameName = c.parentCategoryName || ('게임 ID: ' + c.parentId);
                tbody.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td class="fw-bold text-secondary">${escapeHtml(gameName)}</td>
                        <td class="fw-bold text-primary">${escapeHtml(c.categoryName)}</td>
                        <td>${escapeHtml(c.createdAt)}</td>
                        <td>
                            <button class="btn btn-sm btn-success me-1" onclick="handleCategory(${c.categoryId},'approve')">승인</button>
                            <button class="btn btn-sm btn-danger" onclick="handleCategory(${c.categoryId},'reject')">거절</button>
                        </td>
                    </tr>`);
            });
        } catch (error) {
            console.error('게시판 승인 목록 로드 실패:', error);
        }
    }

    async function handleCategory(categoryId, action) {
        const confirmMsg = action === 'approve' ? '게시판을 승인하여 공개할까요?' : '게시판 생성을 거절(삭제)할까요?';
        if (!confirm(confirmMsg)) return;
        try {
            const body = new URLSearchParams({ categoryId:String(categoryId), action });
            const res = await fetch('admin/categories', {
                method:'POST', credentials:'include',
                headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:body.toString()
            });
            const data = await res.json();
            if (!res.ok || !data.success) { alert(data.message || '처리에 실패했습니다.'); return; }
            alert('처리가 완료되었습니다.');
            loadPendingCategories();
        } catch (error) {
            console.error(error);
            alert('서버 통신 오류가 발생했습니다.');
        }
    }

    // 카테고리 관리자: 담당 게임 확인
    async function checkCategoryManager() {
        const section = document.getElementById('categoryManagerSection');
        try {
            const res = await fetch('category-create', { credentials:'include', cache:'no-store' });
            if (res.status === 401 || res.status === 403) { section.style.display='none'; return; }
            if (!res.ok) throw new Error('관리 게임 조회 실패');

            const data = await res.json();
            if (!data.isManager) { section.style.display='none'; return; }

            section.style.display='block';
            document.getElementById('managedGameLabel').textContent = data.gameName || ('게임 ID: ' + data.categoryId);
        } catch (error) {
            console.error('카테고리 관리자 확인 실패:', error);
            section.style.display='none';
        }
    }

    async function requestCreateCategory() {
        const input = document.getElementById('newCategoryName');
        const msgBox = document.getElementById('createCategoryMsg');
        const categoryName = input.value.trim();
        if (!categoryName) { alert('생성할 게시판 이름을 입력해주세요.'); input.focus(); return; }

        try {
            const body = new URLSearchParams({ categoryName });
            const res = await fetch('category-create', {
                method:'POST', credentials:'include',
                headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:body.toString()
            });
            const data = await res.json();
            if (!res.ok || !data.success) {
                msgBox.innerHTML = `<span class="text-danger fw-bold">✕ ${escapeHtml(data.message || '생성 요청에 실패했습니다.')}</span>`;
                alert(data.message || '게시판 생성 요청에 실패했습니다.');
                return;
            }
            input.value='';
            msgBox.innerHTML = `<span class="text-success fw-bold">✓ ${escapeHtml(data.message)}</span>`;
            alert(data.message + '\n시스템 관리자 승인 후 게시판이 공개됩니다.');
        } catch (error) {
            console.error(error);
            alert('게시판 생성 요청 중 서버 통신 오류가 발생했습니다.');
        }
    }

    function escapeHtml(value) {
        if (value == null) return '';
        return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;');
    }

    // 두 권한은 서로 독립적으로 확인한다.
    checkCategoryManager();
    loadPendingCategories();
</script>
</body>
</html>
