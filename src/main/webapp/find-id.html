<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub - 아이디 찾기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/gamehub.css">
</head>
<body class="login-page">
<div class="login-wrapper">
    <div class="login-logo"><a href="login.html">Game Hub</a></div>

    <div class="login-card">
        <h3 class="text-center mb-4">아이디 찾기</h3>

        <form id="findIdForm">
            <div class="login-input">
                <label for="name">이름</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>

            <div class="login-input">
                <label for="phone">전화번호</label>
                <input type="text" class="form-control" id="phone" name="phone"
                       placeholder="010-1234-5678" required>
            </div>

            <button type="submit" class="btn-login">아이디 찾기</button>
        </form>

        <div id="result" class="text-center mt-4"></div>

        <div class="login-links mt-3">
            <a href="login.html">로그인</a>
            <span class="divider">|</span>
            <a href="find-password.html">비밀번호 찾기</a>
        </div>
    </div>

    <div class="login-footer">&copy; 2026 Game Hub. All rights reserved.</div>
</div>

<script>
document.getElementById("findIdForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    const formData = new URLSearchParams(new FormData(this));
    const result = document.getElementById("result");

    try {
        const response = await fetch("find-id", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8" },
            body: formData
        });

        const data = await response.json();

        if (data.success) {
            result.innerHTML = `<p class="text-success fw-bold">회원님의 아이디는 <strong>${escapeHtml(data.username)}</strong> 입니다.</p>`;
        } else {
            result.innerHTML = `<p class="text-danger">일치하는 회원 정보를 찾을 수 없습니다.</p>`;
        }
    } catch (error) {
        console.error(error);
        result.innerHTML = `<p class="text-danger">아이디 찾기 중 오류가 발생했습니다.</p>`;
    }
});

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>
</body>
</html>
