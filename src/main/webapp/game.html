<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 커뮤니티 - Game Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/gamehub.css">
    <style>
        .game-shell{background:#fff;border:1px solid #e7e7eb;border-radius:14px;overflow:hidden;box-shadow:0 5px 20px rgba(0,0,0,.05)}
        .game-banner{padding:28px 32px;background:linear-gradient(135deg,#352064,#6941c6);color:#fff}
        .game-banner small{opacity:.72}.game-banner h1{font-size:2rem;font-weight:800;margin:5px 0}.game-banner p{margin:0;opacity:.85}
        .community-layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:520px}
        .board-sidebar{background:#f8f7fb;border-right:1px solid #ece9f3;padding:22px 14px}.board-sidebar h3{font-size:.9rem;font-weight:800;color:#777;padding:0 10px 12px;margin:0}
        .board-menu{display:block;width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:8px;color:#333;font-weight:700;margin-bottom:5px;cursor:pointer}.board-menu:hover,.board-menu.active{background:#6941c6;color:#fff}
        .board-content{padding:26px 30px}.board-head{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid #6941c6;padding-bottom:14px;margin-bottom:8px}.board-head h2{font-size:1.35rem;font-weight:800;margin:0}.board-head p{font-size:.85rem;color:#888;margin:0}
        .post-row{display:grid;grid-template-columns:70px minmax(0,1fr) 110px 90px;gap:12px;align-items:center;padding:14px 8px;border-bottom:1px solid #eee;cursor:pointer}.post-row:hover{background:#faf9fd}.post-title{font-weight:700;color:#222;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.post-meta{font-size:.82rem;color:#777}.post-empty{text-align:center;color:#999;padding:80px 20px}.back-home{color:#fff;text-decoration:none;font-size:.9rem;opacity:.85}.back-home:hover{opacity:1}
        @media(max-width:800px){.community-layout{grid-template-columns:1fr}.board-sidebar{border-right:0;border-bottom:1px solid #ece9f3;display:flex;gap:6px;overflow:auto}.board-sidebar h3{display:none}.board-menu{white-space:nowrap;width:auto;margin:0}.post-row{grid-template-columns:55px minmax(0,1fr) 80px}.post-row .views{display:none}}
    </style>
</head>
<body>
<main id="main-content">
    <div class="game-shell">
        <header class="game-banner">
            <a class="back-home" href="home.html">← Game Hub 홈</a>
            <small id="genreName">GAME COMMUNITY</small>
            <h1 id="gameName">게임 커뮤니티</h1>
            <p id="gameDescription">게시판을 선택해 게임 이야기를 나눠보세요.</p>
        </header>
        <div class="community-layout">
            <aside class="board-sidebar" id="boardMenu"><h3>게시판</h3></aside>
            <section class="board-content">
                <div class="board-head">
                    <div>
                        <h2 id="boardTitle">게시판</h2>
                        <p>선택한 게임의 게시글을 확인하세요.</p>
                    </div>
                    <a id="writeLink" href="#" class="btn btn-sm btn-primary">글쓰기</a>
                </div>
                <div id="postList"><div class="post-empty">게시글을 불러오는 중입니다...</div></div>
            </section>
        </div>
    </div>
</main>
<script src="js/common.js"></script>
<script src="js/game-nav.js"></script>
<script>
const GAME_DATA={
  110:{name:'리니지',genre:'RPG'},
  120:{name:'블레이드앤소울',genre:'RPG'},
  130:{name:'메이플스토리',genre:'RPG'},
  140:{name:'로스트아크',genre:'RPG'},
  210:{name:'서든어택',genre:'FPS/TPS'},
  220:{name:'오버워치',genre:'FPS/TPS'},
  230:{name:'발로란트',genre:'FPS/TPS'},
  240:{name:'배틀그라운드',genre:'FPS/TPS'},
  310:{name:'리그 오브 레전드',genre:'MOBA'},
  320:{name:'도타 2',genre:'MOBA'},
  410:{name:'FC 온라인',genre:'스포츠'},
  420:{name:'eFootball',genre:'스포츠'},
  430:{name:'NBA 2K',genre:'스포츠'},
  510:{name:'스타크래프트',genre:'전략'},
  520:{name:'문명 VI',genre:'전략'},
  530:{name:'에이지 오브 엠파이어 IV',genre:'전략'},
  610:{name:'심즈 4',genre:'시뮬레이션'},
  620:{name:'시티즈: 스카이라인 II',genre:'시뮬레이션'},
  630:{name:'유로 트럭 시뮬레이터 2',genre:'시뮬레이션'},
  910:{name:'마인크래프트',genre:'그 외 장르'},
  920:{name:'GTA V',genre:'그 외 장르'},
  930:{name:'철권 8',genre:'그 외 장르'},
  940:{name:'포르자 호라이즌 5',genre:'그 외 장르'},
  950:{name:'데드 바이 데이라이트',genre:'그 외 장르'},
  960:{name:'몬스터헌터 와일즈',genre:'그 외 장르'}
};

const params=new URLSearchParams(location.search);
const requestedGameId=Number(params.get('gameId'));
const gameId=GAME_DATA[requestedGameId]?requestedGameId:110;
const game=GAME_DATA[gameId];
const boards=[
  {id:gameId*10+1,name:'자유게시판'},
  {id:gameId*10+2,name:'질문게시판'},
  {id:gameId*10+3,name:'공략게시판'}
];
const requestedCategoryId=Number(params.get('categoryId'));
let currentBoard=boards.some(board=>board.id===requestedCategoryId)?requestedCategoryId:boards[0].id;
let allPosts=[];

document.getElementById('genreName').textContent=game.genre+' COMMUNITY';
document.getElementById('gameName').textContent=game.name;
document.getElementById('gameDescription').textContent=game.name+' 유저들의 정보와 이야기를 나누는 공간입니다.';

function updateWriteLink(){
    document.getElementById('writeLink').href=`post-write.html?gameId=${gameId}&categoryId=${currentBoard}`;
}

function renderMenu(){
    const menu=document.getElementById('boardMenu');
    menu.innerHTML='<h3>게시판</h3>'+boards.map(board=>`<button class="board-menu ${board.id===currentBoard?'active':''}" data-id="${board.id}">${board.name}</button>`).join('');
    menu.querySelectorAll('.board-menu').forEach(btn=>btn.addEventListener('click',()=>{
        currentBoard=Number(btn.dataset.id);
        history.replaceState(null,'',`game.html?gameId=${gameId}&categoryId=${currentBoard}`);
        renderMenu();
        renderPosts();
        updateWriteLink();
    }));
}

function renderPosts(){
    const board=boards.find(item=>item.id===currentBoard)||boards[0];
    document.getElementById('boardTitle').textContent=board.name;
    const list=allPosts.filter(post=>Number(post.categoryId)===currentBoard);
    const box=document.getElementById('postList');
    if(!list.length){
        box.innerHTML='<div class="post-empty">아직 등록된 게시글이 없습니다.<br><small>첫 번째 글을 작성해보세요.</small></div>';
        return;
    }
    box.innerHTML=list.map(post=>`<div class="post-row" onclick="location.href='post-detail?postId=${post.postId}'"><div class="post-meta">#${post.postId}</div><div class="post-title">${esc(post.title)}</div><div class="post-meta">👤 ${esc(post.username)}</div><div class="post-meta views">조회 ${post.viewCount}</div></div>`).join('');
}

function esc(value){
    return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;');
}

renderMenu();
updateWriteLink();
fetch('posts')
    .then(response=>{if(!response.ok)throw new Error();return response.json();})
    .then(posts=>{allPosts=posts;renderPosts();})
    .catch(()=>{document.getElementById('postList').innerHTML='<div class="post-empty text-danger">게시글을 불러오지 못했습니다.</div>';});
</script>
</body>
</html>
