<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 커뮤니티 - Game Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/gamehub.css">
</head>
<body>
<main id="main-content">
    <div class="game-shell">
        <header class="game-banner">
            <div class="game-banner-main">
                <h1 id="gameName">게임 커뮤니티</h1>
                <p id="gameDescription">게시판을 선택해 게임 이야기를 나눠보세요.</p>
            </div>
            <aside class="game-hot" aria-label="게임 인기 게시글">
                <div class="game-hot-head">
                    <span class="game-hot-title">🔥 지금 인기 있는 글</span>
                    <span class="game-hot-sub">전체 게시판 TOP 5</span>
                </div>
                <div id="gameHotPosts"><div class="game-hot-empty">인기글을 불러오는 중입니다...</div></div>
            </aside>
        </header>
        <div class="community-layout">
            <aside class="board-sidebar" id="boardMenu"><h3>게시판</h3></aside>
            <section class="board-content">
                <div class="board-head">
                    <div><h2 id="boardTitle">게시판</h2><p>선택한 게임의 게시글을 확인하세요.</p></div>
                    <a id="writeLink" href="#" class="btn btn-sm btn-primary">글쓰기</a>
                </div>
                <div id="postList"><div class="post-empty">게시글을 불러오는 중입니다...</div></div>
            </section>
        </div>
    </div>
</main>
<script src="js/common.js"></script>
<script>
    // =========================================================================
    // [기존 코드 영역 1] 게임 메타데이터 및 기본 변수 설정
    // =========================================================================
    const GAME_DATA = {
        110:{name:'리니지',genre:'RPG'},120:{name:'블레이드앤소울',genre:'RPG'},130:{name:'메이플스토리',genre:'RPG'},140:{name:'로스트아크',genre:'RPG'},
        210:{name:'서든어택',genre:'FPS/TPS'},220:{name:'오버워치',genre:'FPS/TPS'},230:{name:'발로란트',genre:'FPS/TPS'},240:{name:'배틀그라운드',genre:'FPS/TPS'},
        310:{name:'리그 오브 레전드',genre:'MOBA'},320:{name:'도타 2',genre:'MOBA'},
        410:{name:'FC 온라인',genre:'스포츠'},420:{name:'eFootball',genre:'스포츠'},430:{name:'NBA 2K',genre:'스포츠'},
        510:{name:'스타크래프트',genre:'전략'},520:{name:'문명 VI',genre:'전략'},530:{name:'에이지 오브 엠파이어 IV',genre:'전략'},
        610:{name:'심즈 4',genre:'시뮬레이션'},620:{name:'시티즈: 스카이라인 II',genre:'시뮬레이션'},630:{name:'유로 트럭 시뮬레이터 2',genre:'시뮬레이션'},
        910:{name:'마인크래프트',genre:'그 외 장르'},920:{name:'GTA V',genre:'그 외 장르'},930:{name:'철권 8',genre:'그 외 장르'},
        940:{name:'포르자 호라이즌 5',genre:'그 외 장르'},950:{name:'데드 바이 데이라이트',genre:'그 외 장르'},960:{name:'몬스터헌터 와일즈',genre:'그 외 장르'}
    };

    const params = new URLSearchParams(location.search);
    const requestedGameId = Number(params.get('gameId'));
    const gameId = GAME_DATA[requestedGameId] ? requestedGameId : 110;
    const game = GAME_DATA[gameId];

    // ★ [수정된 부분] 고정 배열 대신 DB에서 동적으로 채울 빈 배열 선언
    let boards = [];
    const requestedCategoryId = Number(params.get('categoryId'));
    let currentBoard = requestedCategoryId || (gameId * 10 + 1);
    let allPosts = [];

    document.getElementById('gameName').textContent = game.name;
    document.getElementById('gameDescription').textContent = game.name + ' 유저들의 정보와 이야기를 나누는 공간입니다.';


    // =========================================================================
    // [기존 코드 영역 2] UI 렌더링 및 계산 유틸리티 함수들 (변경 없음)
    // =========================================================================
    function updateWriteLink() {
        document.getElementById('writeLink').href = `post-write.html?gameId=${gameId}&categoryId=${currentBoard}`;
    }

    function renderMenu() {
        const menu = document.getElementById('boardMenu');
        menu.innerHTML = '<h3>게시판</h3>' + boards.map(board =>
            `<button class="board-menu ${board.id === currentBoard ? 'active' : ''}" data-id="${board.id}">${esc(board.name)}</button>`
        ).join('');

        menu.querySelectorAll('.board-menu').forEach(btn => btn.addEventListener('click', () => {
            currentBoard = Number(btn.dataset.id);
            history.replaceState(null, '', `game.html?gameId=${gameId}&categoryId=${currentBoard}`);
            renderMenu();
            renderPosts();
            updateWriteLink();
        }));
    }

    function renderPosts() {
        const board = boards.find(item => item.id === currentBoard) || boards[0];
        if (board) {
            document.getElementById('boardTitle').textContent = board.name;
        }
        const list = allPosts.filter(post => Number(post.categoryId) === currentBoard);
        const box = document.getElementById('postList');
        if (!list.length) {
            box.innerHTML = '<div class="post-empty">아직 등록된 게시글이 없습니다.<br><small>첫 번째 글을 작성해보세요.</small></div>';
            return;
        }
        box.innerHTML = list.map(post =>
            `<div class="post-row" onclick="location.href='post-detail?postId=${post.postId}'">
            <div class="post-meta">#${post.postId}</div>
            <div class="post-title">${esc(post.title)}</div>
            <div class="post-meta">👤 ${esc(post.nickname || post.username)}</div>
            <div class="post-meta views">조회 ${post.viewCount}</div>
        </div>`
        ).join('');
    }

    function getScore(post) {
        return (Number(post.viewCount) || 0) + (Number(post.likeCount) || 0) * 3;
    }

    function renderGameHotPosts() {
        const box = document.getElementById('gameHotPosts');
        const list = allPosts
            .filter(post => Math.floor(Number(post.categoryId) / 10) === gameId)
            .sort((a, b) => getScore(b) - getScore(a) || String(b.createdAt).localeCompare(String(a.createdAt)))
            .slice(0, 5);

        if (!list.length) {
            box.innerHTML = '<div class="game-hot-empty">아직 인기 게시글이 없습니다.</div>';
            return;
        }
        box.innerHTML = list.map((post, index) =>
            `<div class="game-hot-row" onclick="location.href='post-detail?postId=${post.postId}'" title="${esc(post.title)}">
            <span class="game-hot-rank">${index + 1}</span>
            <span class="game-hot-post">${esc(post.title)}</span>
            <span class="game-hot-like">👍 ${Number(post.likeCount) || 0}</span>
        </div>`
        ).join('');
    }

    function esc(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }


    // =========================================================================
    // [★ 새로 추가/변경된 영역 ★] DB 카테고리 실시간 조회 및 연동 로직
    // =========================================================================
    // 1. 서버에서 승인된(IS_ACTIVE='Y') 전체 카테고리 목록을 가져옵니다.
    fetch('categories')
        .then(response => {
            if (!response.ok) throw new Error('카테고리 로드 실패');
            return response.json();
        })
        .then(categoryList => {
            // 2. DEPTH가 3(게시판)이고 부모가 현재 게임 ID(gameId)인 것만 필터링
            const activeBoards = categoryList.filter(c => Number(c.depth) === 3 && Number(c.parentId) === gameId);

            if (activeBoards.length > 0) {
                // 🔥 [수정] categoryId 기준으로 오름차순 정렬 (XX1: 자유, XX2: 질문, XX3: 공략이 최상단 고정됨)[cite: 2]
                activeBoards.sort((a, b) => Number(a.categoryId) - Number(b.categoryId));

                // 정렬된 순서대로 boards 배열에 담기[cite: 2]
                boards = activeBoards.map(c => ({ id: c.categoryId, name: c.categoryName }));
            } else {
                // DB 데이터가 비어있을 때를 대비한 기본 3개 폴백[cite: 2]
                boards = [
                    { id: gameId * 10 + 1, name: '자유게시판' },
                    { id: gameId * 10 + 2, name: '질문게시판' },
                    { id: gameId * 10 + 3, name: '공략게시판' }
                ];
            }

            // 현재 선택된 게시판 ID가 목록에 없으면 첫 번째 게시판(자유게시판)으로 초기화[cite: 2]
            if (!boards.some(b => b.id === currentBoard)) {
                currentBoard = boards[0].id;
            }

            // 사이드바 메뉴 렌더링 및 글쓰기 링크 세팅[cite: 2]
            renderMenu();
            updateWriteLink();

            // 3. 게시판 탭 구성이 끝난 후 게시글 목록을 불러옵니다.[cite: 2]
            return fetch('posts');
        })
        .then(response => {
            if (!response.ok) throw new Error('게시글 로드 실패');
            return response.json();
        })
        .then(posts => {
            allPosts = posts;
            renderPosts();
            renderGameHotPosts();
        })
        .catch(() => {
            document.getElementById('postList').innerHTML = '<div class="post-empty text-danger">데이터를 불러오지 못했습니다.</div>';
            document.getElementById('gameHotPosts').innerHTML = '<div class="game-hot-empty">인기글을 불러오지 못했습니다.</div>';
        });
    // =========================================================================
</script>
</body>
</html>
