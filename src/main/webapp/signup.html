<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Game Hub 회원가입</title>
    <link rel="stylesheet" href="css/gamehub.css">
</head>
<body class="login-page">
<div class="login-wrapper">
    <div class="login-logo"><a href="home.html">Game Hub</a></div>
    <div class="login-card">
        <form action="signup" method="post">
            <div class="login-input"><label for="name">이름</label><input class="form-control" id="name" name="name" type="text" required></div>
            <div class="login-input"><label for="username">아이디</label><input class="form-control" id="username" name="username" type="text" required autocomplete="username"></div>
            <div class="login-input"><label for="password">비밀번호</label><input class="form-control" id="password" name="password" type="password" required autocomplete="new-password"></div>
            <div class="login-input"><label for="phone">전화번호</label><input class="form-control" id="phone" name="phone" type="text" placeholder="010-1234-5678" required></div>
            <div class="login-input"><label for="nickname">닉네임</label><input class="form-control" id="nickname" name="nickname" type="text" required></div>
            <button type="submit" class="btn-login">회원가입</button>
        </form>
        <div class="login-links"><a href="login.html">이미 계정이 있나요? 로그인</a></div>
    </div>
    <div class="login-footer">&copy; 2026 Game Hub. All rights reserved.</div>
</div>

<script>
    const params = new URLSearchParams(location.search);
    const error = params.get("error");

    if (error === "username") {
        alert("이미 사용 중인 아이디입니다.");
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    if (error === "nickname") {
        alert("이미 사용 중인 닉네임입니다.");
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    if (error === "required") {
        alert("필수 입력값을 모두 입력해주세요.");
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    if (error === "fail") {
        alert("회원가입에 실패했습니다.");
        window.history.replaceState({}, document.title, window.location.pathname);
    }
</script>
</body>
</html>
