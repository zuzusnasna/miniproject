<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>게임 커뮤니티 게시판</title>

    <!-- 1. Bootstrap CSS CDN (반응형 및 UI 스타일용) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 2. 공통 CSS -->
    <link rel="stylesheet" href="css/gamehub.css">

    <style>
        /* 기본 고정폭(1000px) 제거 및 웹/모바일 반응형 스타일 지정 */
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }

        /* 게시글 상세 스타일 */
        .detail {
            display: none;
            margin-top: 30px;
            border: 1px solid #dee2e6;
            padding: 25px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .detail-info {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .detail-content {
            min-height: 200px;
            padding: 20px;
            background-color: #f8f9fa;
            border: 1px solid #eee;
            border-radius: 6px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .reaction button {
            min-width: 110px;
        }

        #likeCount {
            font-weight: bold;
            color: #0d6efd;
        }

        #dislikeCount {
            font-weight: bold;
            color: #dc3545;
        }

        .title-btn {
            border: none;
            background: none;
            padding: 0;
            font-size: 16px;
            cursor: pointer;
            color: #212529;
            text-align: left;
        }

        .title-btn:hover {
            text-decoration: underline;
            color: #0d6efd;
        }
    </style>
</head>

<body>

<!-- [게시판 메인 콘텐츠] common.js의 layout-grid와 연동하기 위해 main-content로 감싸줍니다 -->
<main id="main-content" class="container-fluid container-xl my-4">
    <div class="card shadow-sm border-0 rounded-3 p-4 bg-white">

        <!-- 상단 헤더 및 버튼 -->
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <h1 class="h3 fw-bold text-dark m-0">🎮 게임 커뮤니티 게시판</h1>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-outline-secondary btn-sm px-3 fw-bold" onclick="location.href='index.html'">메인으로</button>
                <button type="button" class="btn btn-primary btn-sm px-3 fw-bold" onclick="location.href='post-write.html'">✏️ 글쓰기</button>
            </div>
        </div>

        <!-- 일반 전체 게시글 목록 테이블 (반응형 감싸기) -->
        <div class="table-responsive">
            <table class="table table-hover align-middle text-center board-table mb-0">
                <thead class="table-light">
                <tr>
                    <th style="width: 8%;">번호</th>
                    <th style="width: 40%;">제목</th>
                    <th style="width: 15%;">작성자</th>
                    <th style="width: 9%;">조회수</th>
                    <th style="width: 9%;">좋아요</th>
                    <th style="width: 9%;">나빠요</th>
                    <th style="width: 10%;">작성일</th>
                </tr>
                </thead>
                <tbody id="postList">
                <tr>
                    <td colspan="7" class="py-5 text-muted">게시글을 불러오는 중...</td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- 게시글 상세 영역 -->
        <div id="postDetail" class="detail">
            <h2 id="detailTitle" class="fw-bold text-dark mb-3"></h2>
            <div id="detailInfo" class="detail-info"></div>
            <div id="detailContent" class="detail-content mb-4"></div>

            <div class="reaction d-flex justify-content-center gap-2 mb-3">
                <button type="button" class="btn btn-outline-primary fw-bold" onclick="likePost()">
                    👍 좋아요 <span id="likeCount">0</span>
                </button>
                <button type="button" class="btn btn-outline-danger fw-bold" onclick="dislikePost()">
                    👎 나빠요 <span id="dislikeCount">0</span>
                </button>
            </div>

            <div class="close-button text-end border-top pt-3">
                <button type="button" class="btn btn-secondary px-4 fw-bold" onclick="closeDetail()">닫기</button>
            </div>
        </div>

    </div>
</main>

<!-- 1. Bootstrap JS (드롭다운 동작용) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- 2. 공통 JS (카테고리, 인기글, 회원정보 로드) -->
<script src="js/common.js"></script>

<!-- 3. 게시판 전용 비즈니스 로직 -->
<script>
    let selectedPost = null;

    /* =========================
       게시글 목록 불러오기
       ========================= */
    fetch("posts")
        .then(response => {
            if (!response.ok) {
                throw new Error("게시글을 불러오지 못했습니다.");
            }
            return response.json();
        })
        .then(posts => {
            const postList = document.getElementById("postList");
            postList.innerHTML = "";

            if (posts.length === 0) {
                postList.innerHTML = `
                    <tr>
                        <td colspan="7" class="py-5 text-muted">등록된 게시글이 없습니다.</td>
                    </tr>
                `;
                return;
            }

            posts.forEach(post => {
                postList.innerHTML += `
                    <tr>
                        <td>${post.postId}</td>
                        <td class="text-start">
                            <button type="button" class="title-btn" onclick="showPost(${post.postId})">
                                ${escapeHtml(post.title)}
                            </button>
                        </td>
                        <td>${escapeHtml(post.username)}</td>
                        <td>${post.viewCount}</td>
                        <td>${post.likeCount}</td>
                        <td>${post.dislikeCount}</td>
                        <td>${post.createdAt}</td>
                    </tr>
                `;
            });
        })
        .catch(error => {
            console.error(error);
            document.getElementById("postList").innerHTML = `
                <tr>
                    <td colspan="7" class="py-5 text-danger">게시글을 불러오지 못했습니다.</td>
                </tr>
            `;
        });

    /* =========================
       게시글 상세
       ========================= */
    function showPost(postId) {
        fetch("posts")
            .then(response => {
                if (!response.ok) {
                    throw new Error("게시글을 불러오지 못했습니다.");
                }
                return response.json();
            })
            .then(posts => {
                const post = posts.find(p => Number(p.postId) === Number(postId));

                if (!post) {
                    alert("게시글을 찾을 수 없습니다.");
                    return;
                }

                selectedPost = post;

                document.getElementById("detailTitle").textContent = post.title;
                document.getElementById("detailInfo").textContent =
                    "작성자: " + post.username + " | 조회수: " + post.viewCount + " | 작성일: " + post.createdAt;
                document.getElementById("detailContent").textContent = post.content;
                document.getElementById("likeCount").textContent = post.likeCount;
                document.getElementById("dislikeCount").textContent = post.dislikeCount;

                const detail = document.getElementById("postDetail");
                detail.style.display = "block";
                detail.scrollIntoView({ behavior: "smooth" });
            })
            .catch(error => {
                console.error(error);
                alert("게시글을 불러오지 못했습니다.");
            });
    }

    /* =========================
       좋아요
       ========================= */
    function likePost() {
        if (!selectedPost) return;
        const postId = selectedPost.postId;

        fetch("post-like", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            credentials: "include",
            body: "postId=" + encodeURIComponent(postId) + "&likeType=LIKE"
        })
            .then(response => {
                if (response.status === 401) {
                    alert("로그인이 필요합니다.");
                    location.href = "login.html";
                    return null;
                }
                if (!response.ok) {
                    throw new Error("좋아요 처리에 실패했습니다. (" + response.status + ")");
                }
                return response.json();
            })
            .then(data => {
                if (!data) return;

                if (data.success) {
                    selectedPost.likeCount = data.likeCount;
                    selectedPost.dislikeCount = data.dislikeCount;

                    document.getElementById("likeCount").textContent = data.likeCount;
                    document.getElementById("dislikeCount").textContent = data.dislikeCount;

                    if (typeof loadMemberInfo === "function") {
                        loadMemberInfo();
                    }
                    alert("좋아요를 눌렀습니다.");
                } else {
                    alert(data.message || "좋아요 처리에 실패했습니다.");
                }
            })
            .catch(error => {
                console.error("좋아요 처리 오류:", error);
                alert("좋아요 처리 중 오류가 발생했습니다.");
            });
    }

    /* =========================
       나빠요
       ========================= */
    function dislikePost() {
        if (!selectedPost) return;
        const postId = selectedPost.postId;

        fetch("post-like", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            credentials: "include",
            body: "postId=" + encodeURIComponent(postId) + "&likeType=DISLIKE"
        })
            .then(response => {
                if (response.status === 401) {
                    alert("로그인이 필요합니다.");
                    location.href = "login.html";
                    return null;
                }
                if (!response.ok) {
                    throw new Error("나빠요 처리에 실패했습니다. (" + response.status + ")");
                }
                return response.json();
            })
            .then(data => {
                if (!data) return;

                if (data.success) {
                    selectedPost.likeCount = data.likeCount;
                    selectedPost.dislikeCount = data.dislikeCount;

                    document.getElementById("likeCount").textContent = data.likeCount;
                    document.getElementById("dislikeCount").textContent = data.dislikeCount;

                    if (typeof loadMemberInfo === "function") {
                        loadMemberInfo();
                    }
                    alert("나빠요를 눌렀습니다.");
                } else {
                    alert(data.message || "나빠요 처리에 실패했습니다.");
                }
            })
            .catch(error => {
                console.error("나빠요 처리 오류:", error);
                alert("나빠요 처리 중 오류가 발생했습니다.");
            });
    }

    /* =========================
       상세 닫기
       ========================= */
    function closeDetail() {
        document.getElementById("postDetail").style.display = "none";
        selectedPost = null;
    }

    function escapeHtml(value) {
        if (value == null) return "";
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>
</body>

</html>
