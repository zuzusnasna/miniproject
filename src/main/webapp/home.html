<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub - 메인</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/gamehub.css">

    <style>
        .section-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary-color);
            display: inline-block;
        }

        .popular-wrap {
            background: #fff;
            border: 1px solid #ebe8f3;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(55, 34, 95, 0.05);
            margin-bottom: 42px;
        }

        .popular-game-tabs {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            padding: 14px;
            background: #faf9fd;
            border-bottom: 1px solid #ece9f3;
        }

        .popular-game-tab {
            border: 1px solid #e4dff0;
            background: #fff;
            color: #514a5f;
            border-radius: 9px;
            min-height: 42px;
            padding: 8px 10px;
            font-size: .88rem;
            font-weight: 750;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: .18s ease;
        }

        .popular-game-tab:hover {
            border-color: #9b7de2;
            color: #6941c6;
            transform: translateY(-1px);
        }

        .popular-game-tab.active {
            background: #6941c6;
            border-color: #6941c6;
            color: #fff;
            box-shadow: 0 4px 10px rgba(105, 65, 198, .18);
        }

        .popular-panel-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px 10px;
        }

        .popular-panel-title {
            font-size: 1rem;
            font-weight: 800;
            color: #2e2838;
        }

        .popular-game-link {
            color: #6941c6;
            font-size: .8rem;
            font-weight: 700;
            text-decoration: none;
        }

        .popular-list {
            padding: 0 14px 14px;
        }

        .popular-post-row {
            display: grid;
            grid-template-columns: 34px minmax(0, 1fr) 95px 76px;
            gap: 10px;
            align-items: center;
            min-height: 48px;
            padding: 0 10px;
            border-top: 1px solid #f0edf5;
            cursor: pointer;
            transition: background .15s ease;
        }

        .popular-post-row:hover { background: #faf9fd; }
        .popular-rank { font-size: .82rem; font-weight: 800; color: #8a78b3; }
        .popular-post-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; font-weight: 700; color: #26222d; }
        .popular-stat { font-size: .76rem; color: #88818f; text-align: right; white-space: nowrap; }
        .popular-empty { color: #999; text-align: center; padding: 34px 20px; font-size: .88rem; }

        .news-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .news-heading .section-title { margin-bottom: 0; }
        .news-subtitle { margin: 0 0 9px; color: #8b8494; font-size: .78rem; }

        .news-wrap {
            background: #fff;
            border: 1px solid #ebe8f3;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(55, 34, 95, 0.05);
            margin-bottom: 40px;
        }

        .news-featured {
            display: grid;
            grid-template-columns: 160px minmax(0, 1fr);
            gap: 20px;
            padding: 22px;
            text-decoration: none;
            color: inherit;
            border-bottom: 1px solid #eeeaf5;
            transition: background .16s ease;
        }

        .news-featured:hover { background: #fcfbfe; }

        .news-visual {
            min-height: 118px;
            border-radius: 12px;
            background: linear-gradient(145deg, #6941c6, #8b6ddd);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            letter-spacing: .04em;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
        }

        .news-visual strong { font-size: 1.05rem; font-weight: 900; }
        .news-visual span { margin-top: 5px; font-size: .7rem; opacity: .82; letter-spacing: .14em; }
        .news-featured-content { min-width: 0; align-self: center; }
        .news-badge { display: inline-block; margin-bottom: 8px; padding: 4px 8px; border-radius: 999px; background: #f0ebfb; color: #6941c6; font-size: .68rem; font-weight: 800; }
        .news-featured-title { margin: 0 0 8px; color: #27222e; font-size: 1.05rem; line-height: 1.45; font-weight: 850; }
        .news-featured-desc { margin: 0 0 10px; color: #6f6878; font-size: .82rem; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .news-date { color: #9a92a3; font-size: .72rem; white-space: nowrap; }
        .news-list { padding: 0 18px; }

        .news-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 18px;
            align-items: center;
            min-height: 54px;
            padding: 0 6px;
            border-bottom: 1px solid #f1eef5;
            text-decoration: none;
            color: inherit;
            transition: background .15s ease;
        }

        .news-row:last-child { border-bottom: 0; }
        .news-row:hover { background: #faf9fd; }
        .news-row-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #37313e; font-size: .86rem; font-weight: 700; }
        .news-empty { padding: 38px 20px; text-align: center; color: #91899a; font-size: .86rem; }

        @media (max-width: 760px) {
            .popular-game-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .popular-post-row { grid-template-columns: 28px minmax(0, 1fr) 70px; }
            .popular-post-row .popular-views { display: none; }
            .news-heading { display: block; }
            .news-subtitle { margin: -8px 0 16px; }
            .news-featured { grid-template-columns: 1fr; padding: 16px; }
            .news-visual { min-height: 90px; }
            .news-row { grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 10px 6px; }
        }
    </style>
</head>
<body>

<main id="main-content">

    <h2 class="section-title">🔥 게임별 인기 게시글</h2>
    <section class="popular-wrap" aria-label="게임별 인기 게시글">
        <div id="popularGameTabs" class="popular-game-tabs"></div>
        <div class="popular-panel-head">
            <div id="popularPanelTitle" class="popular-panel-title">인기 게시글</div>
            <a id="popularGameLink" class="popular-game-link" href="#">게임 커뮤니티 전체보기 →</a>
        </div>
        <div id="popularPosts" class="popular-list">
            <div class="popular-empty">인기글을 불러오는 중입니다...</div>
        </div>
    </section>

    <div class="news-heading">
        <h2 class="section-title">📰 Game News</h2>
        <p class="news-subtitle">게임 업계의 최신 소식을 확인하세요</p>
    </div>
    <section id="gameNews" class="news-wrap" aria-label="최신 게임 뉴스">
        <div class="news-empty">최신 게임 뉴스를 불러오는 중입니다...</div>
    </section>

</main>

<script src="js/common.js"></script>
<script>
const GAME_DATA={
    110:'리니지',120:'블레이드앤소울',130:'메이플스토리',140:'로스트아크',
    210:'서든어택',220:'오버워치',230:'발로란트',240:'배틀그라운드',
    310:'리그 오브 레전드',320:'도타 2',410:'FC 온라인',420:'eFootball',430:'NBA 2K',
    510:'스타크래프트',520:'문명 VI',530:'에이지 오브 엠파이어 IV',
    610:'심즈 4',620:'시티즈: 스카이라인 II',630:'유로 트럭 시뮬레이터 2',
    910:'마인크래프트',920:'GTA V',930:'철권 8',940:'포르자 호라이즌 5',950:'데드 바이 데이라이트',960:'몬스터헌터 와일즈'
};
const FALLBACK_GAMES=[310,130,140,240,230,220,410,510];
const VIEW_WEIGHT=1;
const LIKE_WEIGHT=3;
let allPosts=[];
let popularGameIds=[];
let selectedGameId=null;

function getGameIdFromCategory(categoryId){ return Math.floor(Number(categoryId)/10); }
function getPopularScore(post){ return (Number(post.viewCount)||0)*VIEW_WEIGHT + (Number(post.likeCount)||0)*LIKE_WEIGHT; }

function selectPopularGames(posts){
    const scoreByGame=new Map();
    posts.forEach(post=>{
        const gameId=getGameIdFromCategory(post.categoryId);
        if(!GAME_DATA[gameId]) return;
        scoreByGame.set(gameId,(scoreByGame.get(gameId)||0)+getPopularScore(post));
    });
    const ranked=[...scoreByGame.entries()].sort((a,b)=>b[1]-a[1]).map(([gameId])=>gameId);
    const merged=[...ranked,...FALLBACK_GAMES].filter((gameId,index,array)=>array.indexOf(gameId)===index);
    return merged.slice(0,8);
}

function renderGameTabs(){
    const tabs=document.getElementById('popularGameTabs');
    tabs.innerHTML=popularGameIds.map(gameId=>`
        <button type="button" class="popular-game-tab ${gameId===selectedGameId?'active':''}" data-game-id="${gameId}">
            ${escapeHtml(GAME_DATA[gameId])}
        </button>
    `).join('');
    tabs.querySelectorAll('.popular-game-tab').forEach(button=>{
        button.addEventListener('click',()=>{
            selectedGameId=Number(button.dataset.gameId);
            renderGameTabs();
            renderPopularPosts();
        });
    });
}

function renderPopularPosts(){
    const container=document.getElementById('popularPosts');
    const title=document.getElementById('popularPanelTitle');
    const gameLink=document.getElementById('popularGameLink');
    const gameName=GAME_DATA[selectedGameId]||'게임';
    title.textContent=`${gameName} 인기 게시글 TOP 10`;
    gameLink.href=`game.html?gameId=${selectedGameId}`;

    const posts=allPosts
        .filter(post=>getGameIdFromCategory(post.categoryId)===selectedGameId)
        .sort((a,b)=>getPopularScore(b)-getPopularScore(a) || String(b.createdAt).localeCompare(String(a.createdAt)))
        .slice(0,10);

    if(!posts.length){
        container.innerHTML=`<div class="popular-empty">${escapeHtml(gameName)}에 아직 등록된 게시글이 없습니다.</div>`;
        return;
    }

    container.innerHTML=posts.map((post,index)=>`
        <div class="popular-post-row" onclick="location.href='post-detail?postId=${post.postId}'">
            <div class="popular-rank">${index+1}</div>
            <div class="popular-post-title">${escapeHtml(post.title)}</div>
            <div class="popular-stat">👍 ${Number(post.likeCount)||0}</div>
            <div class="popular-stat popular-views">조회 ${Number(post.viewCount)||0}</div>
        </div>
    `).join('');
}

fetch('posts')
    .then(response=>{
        if(!response.ok) throw new Error('게시글 로드 실패');
        return response.json();
    })
    .then(posts=>{
        allPosts=Array.isArray(posts)?posts:[];
        popularGameIds=selectPopularGames(allPosts);
        selectedGameId=popularGameIds[0]||FALLBACK_GAMES[0];
        renderGameTabs();
        renderPopularPosts();
    })
    .catch(error=>{
        console.error(error);
        document.getElementById('popularPosts').innerHTML='<div class="popular-empty text-danger">인기글을 불러오지 못했습니다.</div>';
    });

fetch('game-news')
    .then(response=>{
        if(!response.ok) throw new Error('뉴스 로드 실패');
        return response.json();
    })
    .then(data=>renderGameNews(Array.isArray(data.items)?data.items:[]))
    .catch(error=>{
        console.error(error);
        document.getElementById('gameNews').innerHTML='<div class="news-empty">현재 게임 뉴스를 불러올 수 없습니다.</div>';
    });

function renderGameNews(items){
    const container=document.getElementById('gameNews');
    if(!items.length){
        container.innerHTML='<div class="news-empty">표시할 게임 뉴스가 없습니다.</div>';
        return;
    }

    const first=items[0];
    const firstLink=safeNewsUrl(first.originallink||first.link);
    const rows=items.slice(1,5).map(item=>{
        const link=safeNewsUrl(item.originallink||item.link);
        return `
            <a class="news-row" href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">
                <span class="news-row-title">${cleanNewsText(item.title)}</span>
                <span class="news-date">${formatNewsDate(item.pubDate)}</span>
            </a>`;
    }).join('');

    container.innerHTML=`
        <a class="news-featured" href="${escapeHtml(firstLink)}" target="_blank" rel="noopener noreferrer">
            <div class="news-visual" aria-hidden="true">
                <strong>GAME HUB</strong>
                <span>NEWS</span>
            </div>
            <div class="news-featured-content">
                <span class="news-badge">LATEST</span>
                <h3 class="news-featured-title">${cleanNewsText(first.title)}</h3>
                <p class="news-featured-desc">${cleanNewsText(first.description)}</p>
                <span class="news-date">${formatNewsDate(first.pubDate)}</span>
            </div>
        </a>
        <div class="news-list">${rows}</div>`;
}

function cleanNewsText(value){
    if(value===null||value===undefined) return '';
    const textarea=document.createElement('textarea');
    textarea.innerHTML=String(value).replace(/<[^>]*>/g,'');
    return escapeHtml(textarea.value);
}

function formatNewsDate(value){
    if(!value) return '';
    const date=new Date(value);
    if(Number.isNaN(date.getTime())) return '';
    return new Intl.DateTimeFormat('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(date);
}

function safeNewsUrl(value){
    try{
        const url=new URL(String(value||''));
        return (url.protocol==='http:'||url.protocol==='https:')?url.href:'#';
    }catch(e){
        return '#';
    }
}

function escapeHtml(value){
    if(value===null||value===undefined) return '';
    return String(value)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/\"/g,'&quot;')
        .replace(/'/g,'&#039;');
}
</script>

</body>
</html>
