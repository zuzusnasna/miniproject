<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub - 메인</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/gamehub.css">

    <style>
        .section-title { font-size:1.25rem; font-weight:800; margin-bottom:20px; padding-bottom:10px; border-bottom:2px solid var(--primary-color); display:inline-block; }
        .popular-post-card { background:#fff; border:1px solid #e9ecef; border-radius:8px; padding:16px 20px; margin-bottom:12px; cursor:pointer; transition:.2s; display:flex; justify-content:space-between; align-items:center; }
        .popular-post-card:hover { transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.08); border-color:var(--primary-color); }
        .post-info span { font-size:.85rem; color:#666; margin-right:10px; }

        .community-hero { background:linear-gradient(135deg,#3f247f,#6941c6); color:#fff; border-radius:16px; padding:30px; margin-bottom:34px; box-shadow:0 12px 30px rgba(63,36,127,.18); }
        .community-hero h1 { font-size:1.9rem; font-weight:800; margin-bottom:8px; }
        .community-hero p { margin:0; opacity:.85; }

        .genre-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; margin-bottom:40px; }
        .genre-card { position:relative; min-height:180px; border-radius:16px; padding:24px; color:#fff; overflow:visible; box-shadow:0 8px 22px rgba(0,0,0,.1); }
        .genre-card.rpg { background:linear-gradient(135deg,#6f42c1,#9b6ee8); }
        .genre-card.fps { background:linear-gradient(135deg,#27364b,#536b8d); }
        .genre-icon { font-size:2.5rem; }
        .genre-title { font-size:1.35rem; font-weight:800; margin-top:12px; }
        .genre-desc { font-size:.9rem; opacity:.82; }
        .game-float { position:absolute; z-index:20; left:18px; right:18px; top:calc(100% - 16px); padding:12px; border:1px solid rgba(255,255,255,.55); border-radius:12px; background:rgba(255,255,255,.94); backdrop-filter:blur(10px); box-shadow:0 12px 30px rgba(0,0,0,.18); opacity:0; visibility:hidden; transform:translateY(-8px); transition:.18s ease; }
        .genre-card:hover .game-float { opacity:1; visibility:visible; transform:translateY(0); }
        .game-link { display:flex; align-items:center; justify-content:space-between; padding:11px 12px; margin:3px 0; color:#252525; text-decoration:none; border-radius:9px; font-weight:700; }
        .game-link:hover { background:#f1ecfb; color:var(--primary-color); }
        .game-link span { color:#999; font-size:.8rem; }

        @media(max-width:760px){ .genre-grid{grid-template-columns:1fr;} }
    </style>
</head>
<body>
<main id="main-content">
    <section class="community-hero">
        <h1>게임 이야기가 모이는 곳, Game Hub</h1>
        <p>장르를 고르고 원하는 게임 커뮤니티에서 자유롭게 이야기를 나눠보세요.</p>
    </section>

    <h2 class="section-title">🎮 게임 커뮤니티</h2>
    <div class="genre-grid">
        <section class="genre-card rpg">
            <div class="genre-icon">⚔️</div>
            <div class="genre-title">롤플레잉 (RPG)</div>
            <div class="genre-desc">캐릭터와 세계관을 함께 즐기는 RPG 커뮤니티</div>
            <div class="game-float">
                <a class="game-link" href="game.html?gameId=110"><b>리니지</b><span>커뮤니티 입장 →</span></a>
                <a class="game-link" href="game.html?gameId=120"><b>블레이드앤소울</b><span>커뮤니티 입장 →</span></a>
            </div>
        </section>
        <section class="genre-card fps">
            <div class="genre-icon">🔫</div>
            <div class="genre-title">슈팅 (FPS)</div>
            <div class="genre-desc">빠른 판단과 팀플레이를 즐기는 FPS 커뮤니티</div>
            <div class="game-float">
                <a class="game-link" href="game.html?gameId=210"><b>서든어택</b><span>커뮤니티 입장 →</span></a>
                <a class="game-link" href="game.html?gameId=220"><b>오버워치</b><span>커뮤니티 입장 →</span></a>
            </div>
        </section>
    </div>

    <h2 class="section-title">🔥 주간 인기 게시글</h2>
    <div id="popularPosts" class="mb-5"><p class="text-muted p-3">인기글을 불러오는 중입니다...</p></div>
</main>

<script src="js/common.js"></script>
<script>
    fetch("posts")
        .then(response => { if (!response.ok) throw new Error("게시글 로드 실패"); return response.json(); })
        .then(posts => {
            const container = document.getElementById("popularPosts");
            container.innerHTML = "";
            if (posts.length === 0) { container.innerHTML = "<p class='text-muted p-3'>등록된 게시글이 없습니다.</p>"; return; }
            posts.sort((a,b) => (b.viewCount + b.likeCount*5) - (a.viewCount + a.likeCount*5)).slice(0,3).forEach(post => {
                container.innerHTML += `<div class="popular-post-card" onclick="location.href='post-detail?postId=${post.postId}'"><div><h5 class="mb-1" style="font-weight:600;color:#111;">${escapeHome(post.title)}</h5><div class="post-info"><span>👤 ${escapeHome(post.username)}</span><span>📅 ${post.createdAt.split(' ')[0]}</span></div></div><div class="text-end" style="min-width:80px;"><span style="color:#1976d2;font-weight:bold;font-size:1.1rem;">👍 ${post.likeCount}</span><div class="text-muted" style="font-size:.8rem;">조회 ${post.viewCount}</div></div></div>`;
            });
        })
        .catch(error => { console.error(error); document.getElementById("popularPosts").innerHTML = "<p class='text-danger p-3'>인기글을 불러오지 못했습니다.</p>"; });

    function escapeHome(value) { if (!value) return ""; return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;"); }
</script>
</body>
</html>
