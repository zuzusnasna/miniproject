<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 탈퇴 - Game Hub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/gamehub.css">

    <style>
        .withdraw-container {
            max-width: 500px;
            margin: 60px auto;
            background: #fff;
            padding: 40px 30px;
            border-radius: 12px;
            border: 1px solid var(--border-color, #e0e0e0);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }

        .warning-icon {
            font-size: 50px;
            color: #dc3545;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<main id="main-content">
    <div class="withdraw-container">

        <div class="warning-icon">⚠️</div>
        <h2 class="fw-bold mb-3">회원 탈퇴 안내</h2>

        <div class="alert alert-danger text-start mb-4">
            <strong>주의사항</strong><br>
            - 탈퇴 시 가입된 회원 정보는 비활성화됩니다.<br>
            - 동일한 아이디로 다시 로그인하거나 재가입할 수 없습니다.<br>
            - 작성하신 게시글과 댓글은 자동으로 삭제되지 않습니다.
        </div>

        <p class="text-muted mb-4 pb-2 border-bottom">
            정말로 Game Hub를 탈퇴하시겠습니까?
        </p>

        <!-- 버튼 영역 -->
        <div class="d-flex justify-content-center gap-3">
            <button type="button" class="btn btn-secondary px-4" onclick="history.back()">취소</button>
            <button type="button" class="btn btn-danger px-4" onclick="executeWithdraw()">탈퇴하기</button>
        </div>

    </div>
</main>

<script src="js/common.js"></script>

<script>
    // 서블릿과 통신하여 실제 탈퇴 처리를 진행하는 함수
    function executeWithdraw() {
        // 마지막으로 한 번 더 확인 (보안 및 실수 방지)
        if (!confirm("정말 탈퇴하시겠습니까? 이 작업은 되돌릴 수 없습니다.")) {
            return;
        }

        fetch("member-withdraw", {
            method: "POST"
        })
            .then(response => {
                // 서블릿에서 보낸 JSON 응답 파싱
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    alert(data.message); // "탈퇴 처리가 완료되었습니다."
                    location.href = "login.html"; // 성공 시 로그인 페이지로 강제 이동
                } else {
                    alert(data.message); // 실패 메시지
                }
            })
            .catch(error => {
                console.error("탈퇴 에러:", error);
                alert("서버 통신 중 에러가 발생했습니다.");
            });
    }
</script>

</body>
</html>
