<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 커뮤니티 공지사항</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/gamehub.css">

    <style>
        body { margin: 40px auto; width: 1000px; font-family: Arial, sans-serif; }
        .top { display: flex; justify-content: space-between; margin-bottom: 15px; }
        button { padding: 8px 15px; cursor: pointer; border: 1px solid #ccc; background: white; border-radius: 4px; }
        button:hover { background-color: #f5f5f5; }

        table.board-table { width: 100%; border-collapse: collapse; }
        table.board-table th, table.board-table td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        table.board-table th { background-color: #f5f5f5; }
        .title { text-align: left; }

        /* 공지 뱃지 스타일 */
        .notice-badge {
            background-color: #d32f2f;
            color: white;
            padding: 2px 6px;
            font-size: 12px;
            border-radius: 3px;
            margin-right: 5px;
            font-weight: bold;
        }
        .empty { padding: 40px; text-align: center; color: #666; }
    </style>
</head>
<body>

<main id="main-content">
    <h1>📢 공지사항</h1>

    <div class="top">
        <button type="button" onclick="location.href='home.html'">메인으로</button>
        <button type="button" onclick="location.href='post.html'">일반 게시판 가기</button>
    </div>

    <table class="board-table">
        <thead>
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성자</th>
            <th>조회수</th>
            <th>작성일</th>
        </tr>
        </thead>
        <tbody id="noticeList">
        <tr><td colspan="5" class="empty">공지사항을 불러오는 중...</td></tr>
        </tbody>
    </table>
</main>

<script src="js/common.js"></script>

<script>
    // 페이지 로드 시 공지사항 목록을 불러옵니다.
    fetch("notices")
        .then(response => {
            if (!response.ok) throw new Error("공지사항을 불러오지 못했습니다.");
            return response.json();
        })
        .then(notices => {
            const list = document.getElementById("noticeList");
            list.innerHTML = "";

            if (notices.length === 0) {
                list.innerHTML = `<tr><td colspan="5" class="empty">등록된 공지사항이 없습니다.</td></tr>`;
                return;
            }

            notices.forEach(notice => {
                // 기존 post-detail 서블릿을 그대로 활용해 상세 페이지로 이동하도록 연결
                list.innerHTML += `
                    <tr>
                        <td>${notice.postId}</td>
                        <td class="title">
                            <span class="notice-badge">공지</span>
                            <a href="post-detail?postId=${notice.postId}" style="text-decoration: none; color: #222;">
                                ${escapeHtml(notice.title)}
                            </a>
                        </td>
                        <td>${escapeHtml(notice.username)}</td>
                        <td>${notice.viewCount}</td>
                        <td>${notice.createdAt}</td>
                    </tr>
                `;
            });
        })
        .catch(error => {
            console.error(error);
            document.getElementById("noticeList").innerHTML = `<tr><td colspan="5" class="empty">목록을 불러오지 못했습니다.</td></tr>`;
        });

    function escapeHtml(value) {
        if (!value) return "";
        return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
