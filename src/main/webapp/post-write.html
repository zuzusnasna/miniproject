<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 - Game Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/gamehub.css">
    <style>
        .write-layout {
            display:grid;
            grid-template-columns:220px minmax(0,1fr);
            gap:16px;
            align-items:start;
            width:100%;
        }
        .write-board-sidebar {
            background:#f8f7fb;
            border:1px solid #ece9f3;
            border-radius:12px;
            padding:22px 14px;
        }
        .write-board-sidebar h3 {
            font-size:.9rem;
            font-weight:800;
            color:#777;
            padding:0 10px 12px;
            margin:0;
        }
        .write-board-link {
            display:block;
            width:100%;
            padding:12px 14px;
            border-radius:8px;
            color:#333;
            font-weight:700;
            margin-bottom:5px;
            text-decoration:none;
        }
        .write-board-link:hover,
        .write-board-link.active {
            background:#6941c6;
            color:#fff;
        }
        .write-content { min-width:0; }
        .write-card {
            width:100%;
            background:#fff;
            border-radius:12px;
        }
        @media(max-width:800px) {
            .write-layout { grid-template-columns:1fr; }
            .write-board-sidebar {
                display:flex;
                gap:6px;
                overflow:auto;
            }
            .write-board-sidebar h3 { display:none; }
            .write-board-link {
                white-space:nowrap;
                width:auto;
                margin:0;
            }
        }
    </style>
</head>
<body>
<main id="main-content" class="my-5">
    <div class="write-layout">
        <aside class="write-board-sidebar" id="writeBoardMenu">
            <h3>게시판</h3>
        </aside>

        <section class="write-content">
            <div class="card write-card p-4 p-md-5 shadow-sm border-0 rounded-3">
                <div class="border-bottom pb-3 mb-4">
                    <div id="writeLocation" class="text-primary small fw-bold mb-1">게시판 확인 중...</div>
                    <h2 class="mb-0 fw-bold text-dark">게시글 작성</h2>
                </div>

                <form action="post-write" method="post" id="postWriteForm">
                    <input type="hidden" id="categoryId" name="categoryId">
                    <input type="hidden" id="gameId" name="gameId">

                    <div class="mb-3">
                        <label for="title" class="form-label fw-bold">제목</label>
                        <input type="text" class="form-control form-control-lg" id="title" name="title" maxlength="300" placeholder="제목을 입력하세요" required>
                    </div>

                    <div class="mb-4">
                        <label for="content" class="form-label fw-bold">내용</label>
                        <textarea class="form-control" id="content" name="content" rows="12" placeholder="내용을 입력하세요" required style="resize: vertical;"></textarea>
                    </div>

                    <div class="d-flex gap-2 justify-content-end pt-3 border-top">
                        <button type="button" id="cancelButton" class="btn btn-outline-secondary px-4 fw-bold">취소</button>
                        <button type="submit" class="btn btn-primary px-4 fw-bold">작성</button>
                    </div>
                </form>
            </div>
        </section>
    </div>
</main>
<script src="js/common.js"></script>
<script>
    const GAME_NAMES = {
        110:'리니지',120:'블레이드앤소울',130:'메이플스토리',140:'로스트아크',
        210:'서든어택',220:'오버워치',230:'발로란트',240:'배틀그라운드',
        310:'리그 오브 레전드',320:'도타 2',
        410:'FC 온라인',420:'eFootball',430:'NBA 2K',
        510:'스타크래프트',520:'문명 VI',530:'에이지 오브 엠파이어 IV',
        610:'심즈 4',620:'시티즈: 스카이라인 II',630:'유로 트럭 시뮬레이터 2',
        910:'마인크래프트',920:'GTA V',930:'철권 8',
        940:'포르자 호라이즌 5',950:'데드 바이 데이라이트',960:'몬스터헌터 와일즈'
    };

    const params = new URLSearchParams(location.search);
    const gameId = Number(params.get('gameId'));
    const categoryId = Number(params.get('categoryId'));
    const validGame = Object.prototype.hasOwnProperty.call(GAME_NAMES, gameId);
    const boardSuffix = categoryId - (gameId * 10);
    const validBoard = validGame && (boardSuffix >= 1 && boardSuffix <= 9);

    if (!validBoard) {
        alert('게시판 정보가 올바르지 않습니다. 게임 게시판에서 다시 글쓰기를 눌러주세요.');
        location.href = 'home.html';
    } else {
        // 1. 기본 form hidden 값 및 취소 버튼 이벤트 세팅
        document.getElementById('categoryId').value = categoryId;
        document.getElementById('gameId').value = gameId;
        document.getElementById('cancelButton').addEventListener('click', () => {
            location.href = `game.html?gameId=${gameId}&categoryId=${categoryId}`;
        });

        // 2. 🔥 DB에서 승인된 게시판 목록을 실시간으로 가져와 사이드바와 위치명을 렌더링합니다.
        fetch('categories')
            .then(res => {
                if (!res.ok) throw new Error('카테고리 로드 실패');
                return res.json();
            })
            .then(categoryList => {
                // 현재 게임(gameId) 하위의 활성 게시판(DEPTH=3)만 필터링
                const activeBoards = categoryList.filter(c => Number(c.depth) === 3 && Number(c.parentId) === gameId);

                // fallback 목록
                const boards = activeBoards.length > 0 ? activeBoards : [
                    { categoryId: gameId * 10 + 1, categoryName: '자유게시판' },
                    { categoryId: gameId * 10 + 2, categoryName: '질문게시판' },
                    { categoryId: gameId * 10 + 3, categoryName: '공략게시판' }
                ];

                // 좌측 사이드바 렌더링
                const menu = document.getElementById('writeBoardMenu');
                if (menu) {
                    menu.innerHTML = '<h3>게시판</h3>' + boards.map(b => {
                        const active = Number(b.categoryId) === categoryId ? ' active' : '';
                        return `<a class="write-board-link${active}" href="game.html?gameId=${gameId}&categoryId=${b.categoryId}">${escapeHtml(b.categoryName)}</a>`;
                    }).join('');
                }

                // 상단 위치 경로 텍스트 설정 (예: 리니지 > 리니지테스트게시판이에요)
                const currentBoardObj = boards.find(b => Number(b.categoryId) === categoryId);
                const boardName = currentBoardObj ? currentBoardObj.categoryName : '게시판';
                document.getElementById('writeLocation').textContent = `${GAME_NAMES[gameId]} > ${boardName}`;
            })
            .catch(err => {
                console.error(err);
                document.getElementById('writeLocation').textContent = `${GAME_NAMES[gameId]} > 게시판`;
            });
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }
</script>
</body>
</html>
