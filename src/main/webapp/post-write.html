<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 - Game Hub</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 공통 CSS -->
    <link rel="stylesheet" href="css/gamehub.css">
</head>

<body>

<!-- 중앙 정렬 및 여백을 위한 컨테이너 (max-width 적용) -->
<main id="main-content" class="container my-5" style="max-width: 800px;">
    <div class="card p-4 p-md-5 shadow-sm border-0 rounded-3">
        <h2 class="mb-4 fw-bold text-dark border-bottom pb-3">게시글 작성</h2>

        <form action="post-write" method="post">
            <!-- 제목 입력 -->
            <div class="mb-3">
                <label for="title" class="form-label fw-bold">제목</label>
                <input type="text" class="form-control form-control-lg" id="title" name="title" maxlength="300" placeholder="제목을 입력하세요" required>
            </div>

            <!-- 내용 입력 -->
            <div class="mb-4">
                <label for="content" class="form-label fw-bold">내용</label>
                <textarea class="form-control" id="content" name="content" rows="12" placeholder="내용을 입력하세요" required style="resize: vertical;"></textarea>
            </div>

            <!-- 버튼 영역 (우측 정렬) -->
            <div class="d-flex gap-2 justify-content-end pt-3 border-top">
                <button type="button" class="btn btn-outline-secondary px-4 fw-bold" onclick="location.href='post.html'">취소</button>
                <button type="submit" class="btn btn-primary px-4 fw-bold">작성</button>
            </div>
        </form>
    </div>
</main>

<!-- 공통 JS -->
<script src="js/common.js"></script>

</body>
</html>
