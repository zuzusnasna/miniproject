<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>게임 커뮤니티 로그인</title>

    <link
            rel="stylesheet"
            href="css/gamehub.css"
    >

</head>


<body class="login-page">

<div class="login-wrapper">

    <div class="login-logo">

        <a href="login.html">
            Game Hub
        </a>

    </div>


    <div class="login-card">

        <form
                action="login"
                method="post"
        >

            <div class="login-input">

                <label for="username">
                    아이디
                </label>

                <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="아이디"
                        required
                        autocomplete="username"
                >

            </div>


            <div class="login-input">

                <label for="password">
                    비밀번호
                </label>

                <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="비밀번호"
                        required
                        autocomplete="current-password"
                >

            </div>


            <button
                    type="submit"
                    class="btn-login"
            >
                로그인
            </button>

        </form>


        <div class="login-links">

            <a href="#">
                아이디 찾기
            </a>

            <span class="divider">|</span>

            <a href="#">
                비밀번호 찾기
            </a>

            <span class="divider">|</span>

            <a
                    href="signup.html"
                    style="
                    color: var(--primary-color);
                    font-weight: bold;
                "
            >
                회원가입
            </a>

        </div>

    </div>


    <div class="login-footer">

        &copy; 2026 Game Hub.
        All rights reserved.

    </div>

</div>

</body>

</html>
