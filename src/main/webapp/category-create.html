<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내 게임 게시판 생성 테스트</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 40px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-top: 0; border-bottom: 2px solid #28a745; padding-bottom: 10px; }
        .desc { color: #666; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        button { background-color: #28a745; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        #result { margin-top: 20px; padding: 15px; border-radius: 4px; background-color: #e9ecef; white-space: pre-wrap; font-family: monospace; word-break: break-all; }
        .success { background-color: #d4edda !important; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da !important; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎮 내 게임 게시판 생성</h2>
    <p class="desc">현재 로그인된 관리자 계정의 권한을 서버가 자동으로 확인하여,<br>해당 게임 하위에 새 게시판(카테고리)을 생성합니다.</p>

    <div class="form-group">
        <label for="categoryName">생성할 게시판/탭 이름</label>
        <input type="text" id="categoryName" placeholder="예: 공지사항 탭, 자유 게시판 등" value="공지사항 탭">
    </div>

    <button onclick="createCategory()">게시판 생성 요청</button>
    <div id="result">서버 응답 결과가 여기에 표시됩니다.</div>
</div>

<script>
    function createCategory() {
        const categoryName = document.getElementById("categoryName").value;
        const resultDiv = document.getElementById("result");

        if (!categoryName) {
            alert("게시판 이름을 입력해주세요.");
            return;
        }

        const formData = new URLSearchParams();
        formData.append("categoryName", categoryName);

        fetch("category-create", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString()
        })
            .then(response => response.json())
            .then(data => {
                resultDiv.textContent = JSON.stringify(data, null, 2);
                resultDiv.className = data.success ? "success" : "error";
            })
            .catch(error => {
                console.error("통신 에러:", error);
                resultDiv.textContent = "서버 통신 중 에러가 발생했습니다: " + error;
                resultDiv.className = "error";
            });
    }
</script>
</body>
</html>
