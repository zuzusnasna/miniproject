<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub - 비밀번호 찾기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/gamehub.css">
</head>
<body class="login-page">
<div class="login-wrapper">
    <div class="login-logo"><a href="login.html">Game Hub</a></div>

    <div class="login-card">
        <h3 class="text-center mb-4">비밀번호 찾기</h3>

        <form action="find-password" method="post">
            <div class="login-input">
                <label for="username">아이디</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>

            <div class="login-input">
                <label for="name">이름</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>

            <div class="login-input">
                <label for="phone">전화번호</label>
                <input type="text" class="form-control" id="phone" name="phone"
                       placeholder="010-1234-5678" required>
            </div>

            <div class="login-input">
                <label for="newPassword">새 비밀번호</label>
                <input type="password" class="form-control" id="newPassword" name="newPassword"
                       placeholder="회원 확인 후 입력" minlength="4">
            </div>

            <div class="login-input">
                <label for="confirmPassword">새 비밀번호 확인</label>
                <input type="password" class="form-control" id="confirmPassword"
                       placeholder="새 비밀번호 확인">
            </div>

            <button type="submit" class="btn-login">비밀번호 변경</button>
        </form>

        <div id="message" class="text-center mt-3"></div>

        <div class="login-links mt-3">
            <a href="login.html">로그인</a>
            <span class="divider">|</span>
            <a href="find-id.html">아이디 찾기</a>
        </div>
    </div>

    <div class="login-footer">&copy; 2026 Game Hub. All rights reserved.</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const message = document.getElementById("message");

if (params.get("error") === "true") {
    message.innerHTML = '<p class="text-danger">아이디, 이름, 전화번호가 일치하지 않습니다.</p>';
}

if (params.get("updateError") === "true") {
    message.innerHTML = '<p class="text-danger">비밀번호 변경에 실패했습니다.</p>';
}

document.querySelector("form").addEventListener("submit", function (event) {
    const password = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (!password || password !== confirmPassword) {
        event.preventDefault();
        message.innerHTML = '<p class="text-danger">새 비밀번호를 입력하고 동일하게 확인해주세요.</p>';
    }
});
</script>
</body>
</html>
